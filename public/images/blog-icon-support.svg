<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.db-float{transform-box:fill-box;transform-origin:center;animation:dbFloat 3s ease-in-out infinite}
@keyframes dbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.db-ring{animation:dbPulse 2.5s ease-in-out infinite}
.ring-two{animation-delay:.5s}
@keyframes dbPulse{0%,100%{stroke:#17afbd;opacity:.45}50%{stroke:#42e8f5;opacity:1}}
.db-particle{filter:url(#dbGlow);animation:dbParticle 2s ease-in-out infinite}
.particle-two{animation-delay:.6s}
.particle-three{animation-delay:1s}
@keyframes dbParticle{0%,100%{opacity:.2;transform:translateY(3px)}50%{opacity:1;transform:translateY(-5px)}}
</style>
<defs>
<linearGradient id="dbBody" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#414750"/>
<stop offset="100%" stop-color="#171b22"/>
</linearGradient>
<linearGradient id="dbTop" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#303943"/>
<stop offset="100%" stop-color="#151a20"/>
</linearGradient>
<filter id="dbGlow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
<feGaussianBlur stdDeviation="2.5" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g class="db-float">
<path d="M18 27 V70 C18 84 82 84 82 70 V27 Z" fill="url(#dbBody)" stroke="#17afbd" stroke-width="1.5"/>
<path d="M18 70 C18 84 82 84 82 70" fill="none" stroke="#17afbd" stroke-width="2"/>
<path class="db-ring ring-one" d="M18 42 C18 55 82 55 82 42" fill="none" stroke="#17afbd" stroke-width="2"/>
<path class="db-ring ring-two" d="M18 56 C18 69 82 69 82 56" fill="none" stroke="#17afbd" stroke-width="2"/>
<ellipse cx="50" cy="27" rx="32" ry="12" fill="url(#dbTop)" stroke="#17afbd" stroke-width="2"/>
<ellipse cx="50" cy="27" rx="24" ry="7" fill="none" stroke="#17afbd" stroke-width="1" opacity=".5"/>
<circle class="db-particle particle-one" cx="12" cy="35" r="2" fill="#17afbd"/>
<circle class="db-particle particle-two" cx="87" cy="55" r="2" fill="#17afbd"/>
<circle class="db-particle particle-three" cx="76" cy="15" r="1.5" fill="#ffffff"/>
</g>
</svg>
